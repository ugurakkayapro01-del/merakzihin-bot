name: Merak Zihin - Otomatik Paylaşım

on:
  schedule:
    # Türkiye saati (UTC+3): 08:45, 12:45, 17:45, 20:45, 23:15
    - cron: "45 5 * * *"
    - cron: "45 9 * * *"
    - cron: "45 14 * * *"
    - cron: "45 17 * * *"
    - cron: "15 20 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Zaman dilimi (sabah, ogle, aksam, gece, gece_gec) — boşsa saate göre"
        required: false
        default: ""
      dry_run:
        description: "Sadece üret, paylaşma"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: merakzihin-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p fonts && cd fonts
          npm pack @fontsource/anton@5.3.0 @fontsource/inter@5.3.0 >/dev/null 2>&1
          tar xzf fontsource-anton-5.3.0.tgz && cp package/files/anton-latin-400-normal.woff2 package/files/anton-latin-ext-400-normal.woff2 . && rm -rf package
          tar xzf fontsource-inter-5.3.0.tgz && cp package/files/inter-latin-700-normal.woff2 package/files/inter-latin-800-normal.woff2 package/files/inter-latin-ext-700-normal.woff2 package/files/inter-latin-ext-800-normal.woff2 . && rm -rf package
          rm -f *.tgz
          ls
      - name: Zaman dilimini belirle
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "45 5 * * *")  S=sabah ;;
            "45 9 * * *")  S=ogle ;;
            "45 14 * * *") S=aksam ;;
            "45 17 * * *") S=gece ;;
            "15 20 * * *") S=gece_gec ;;
            *) S="${{ github.event.inputs.slot }}" ;;
          esac
          echo "slot=$S" >> "$GITHUB_OUTPUT"
      - name: Üret ve paylaş
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          git config user.name "merakzihin-bot"
          git config user.email "merakzihin-bot@users.noreply.github.com"
          git pull --rebase
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python src/run.py ${{ steps.slot.outputs.slot }} --dry-run
          else
            python src/run.py ${{ steps.slot.outputs.slot }}
          fi
      - name: Önizleme (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: onizleme
          path: posts/
